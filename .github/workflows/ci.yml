name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Check spelling
        run: make spelling

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Pull requests measure coverage for their own ratchet and nothing else:
      # no report is published and CodeScene is never contacted from here.
      # A push to main measures in coverage-main.yml instead, which owns the
      # baseline this ratchet compares against, so the selection below must
      # match that workflow's field for field.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          output-path: coverage.xml
          format: cobertura
          python-source: create_labels
          baseline-python-file: .coverage-baseline.python
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'
